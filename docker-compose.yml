version: "3.9"

services:
  app:
    restart: unless-stopped
    build: .
    container_name: crusadefive
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crusadefive
      SPRING_DATASOURCE_USERNAME: cr_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

  db:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: crusadefive
      POSTGRES_USER: cr_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cr_user"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: